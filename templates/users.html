{% extends "base.html" %}
{% block content %}
<h2>Пользователи</h2>
<div class="table-responsive">
    <table class="table table-hover">
        <thead class="thead-light">
            <tr>
                <th>Никнейм</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.nickname }}</td>
                <td>
                    {% if current_user.id != user.id %}
                        <a href="{{ url_for('send_message', user_id=user.id) }}" class="btn btn-sm btn-outline-primary">Написать</a>
                        <a href="{{ url_for('chat', user_id=user.id) }}" class="btn btn-sm btn-outline-secondary">Чат</a>
                    {% else %}
                        <!-- Кнопка удаления своего аккаунта -->
                        <form method="post" action="{{ url_for('delete_account') }}" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Вы уверены? Все ваши сообщения и чаты будут безвозвратно удалены.');">
                                Удалить аккаунт
                            </button>
                        </form>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
